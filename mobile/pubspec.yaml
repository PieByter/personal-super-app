name: personal_super_app
description: Personal Super App - 10 modules for life management
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  go_router: ^14.6.0
  intl: ^0.19.0
  fl_chart: ^0.69.2
  table_calendar: ^3.1.3
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  csv: ^6.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0
  connectivity_plus: ^6.1.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.2
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.2.0
  multi_select_flutter: ^4.1.3

flutter:
